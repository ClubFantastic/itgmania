<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>ITGmania</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    canvas { display: none; width: 100vw; height: 100vh; }
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #111; z-index: 10;
    }
    #overlay h1 { font-size: 3em; margin-bottom: 0.5em; }
    #start-btn {
      font-size: 1.5em; padding: 0.6em 2em;
      background: #e44; color: #fff; border: none;
      border-radius: 8px; cursor: pointer;
    }
    #start-btn:hover { background: #f66; }
    #start-btn:disabled { background: #666; cursor: wait; }
    #status { margin-top: 1em; font-size: 0.9em; color: #aaa; }
    #output { display: none; }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>ITGmania</h1>
    <button id="start-btn" disabled>Load Game</button>
    <div id="status">Downloading...</div>
  </div>
  <canvas id="canvas" class="emscripten" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="output"></div>

  <script>
    var statusEl = document.getElementById('status');
    var Module = {
      preRun: [],
      postRun: [],
      noInitialRun: true,
      canvas: document.getElementById('canvas'),
      print: function(text) { console.log(text); },
      printErr: function(text) { console.warn(text); },
      setStatus: function(text) {
        if (statusEl) statusEl.textContent = text;
      },
      onRuntimeInitialized: function() {
        statusEl.textContent = 'Ready!';
        var btn = document.getElementById('start-btn');
        btn.disabled = false;
        btn.textContent = 'Start Game';
      },
    };

    document.getElementById('start-btn').addEventListener('click', function() {
      this.disabled = true;
      this.textContent = 'Starting...';
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('canvas').style.display = 'block';
      document.getElementById('canvas').focus();
      Module.callMain();
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
